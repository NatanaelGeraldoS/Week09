name: 05 - Setup Monitoring

on:
    workflow_run:
        workflows:
            - "03 - Test Staging"
        types:
            - completed
        branches:
            - main
    workflow_dispatch:

jobs:
    setup-monitoring:
        name: Deploy Prometheus & Grafana
        runs-on: ubuntu-latest

        if: >
            ${{ github.event.workflow_run.conclusion == 'success' }}

        steps:
            - name: Login to Azure
              uses: azure/login@v3
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{vars.AKS_RESOURCE_GROUP}} \
                    --name ${{vars.AKS_CLUSTER_NAME}}
                    --overwrite-existing

            - name: Setup Helm
              uses: azure/setup-helm@v4

            - name: Add Prometheus Helm repository
              run: |
                  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
                  helm repo update

            - name: Install or Upgrade kube-prometheus-stack
              run: |
                  helm upgrade --install prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace --wait --timeout 10m

            - name: Verify monitoring pods are running
              run: |
                  kubectl get pods -n monitoring
                  kubectl wait --for=condition=Ready pods --all -n monitoring --timeout=400s

            - name: Verify Grafana service exists
              run: |
                  kubectl get svc prometheus-grafana -n monitoring
